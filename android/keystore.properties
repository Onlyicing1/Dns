# Signing config for release builds.
#
# This keystore is committed to the repository ON PURPOSE so GitHub Actions can
# sign release APKs without repository secrets. It is a public, well-known key:
# treat it as "the identity of this app's official builds", not as a secret.
# The consequence is that anyone holding this file can produce an APK that
# Android will accept as an update to an installed DNS Console. Only install
# builds downloaded from this repository's Releases page.
storeFile=keystore/dnsconsole-release.jks
storePassword=dnsconsole
keyAlias=dnsconsole
keyPassword=dnsconsole
